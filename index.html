<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2787f5">
<meta name="description" content="Cardigram — un espace simple et chaleureux pour discuter avec vos assistants IA.">
<title>Cardigram — assistants IA</title>
<style>
:root{color-scheme:light;--blue:#2787f5;--bg:#e9eef3;--panel:#fff;--text:#17212b;--muted:#708090;--line:#e6e9ed;--soft:#f3f6f9;--out:#e1ffc7;--shadow:0 12px 40px #17212b12}*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100dvh;max-width:1440px;margin:auto;background:var(--panel);display:grid;grid-template-columns:350px minmax(0,1fr);box-shadow:var(--shadow)}.list-pane{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}.list-head{height:70px;display:flex;align-items:center;padding:0 20px;gap:12px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:800;letter-spacing:-.04em;color:var(--blue);flex:1}.icon-btn{width:42px;height:42px;border:0;border-radius:50%;background:transparent;font-size:20px}.icon-btn:hover{background:var(--soft)}.search-wrap{margin:16px 14px 10px;padding:0 14px;height:44px;border-radius:24px;background:var(--soft);display:flex;align-items:center;gap:9px;color:var(--muted)}.search-wrap input{border:0;outline:0;background:transparent;min-width:0;width:100%;color:var(--text)}.section-label{padding:10px 20px 6px;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}.contact-list{overflow:auto;padding:2px 8px 14px}.contact{width:100%;display:flex;align-items:center;gap:12px;padding:11px;border:0;border-radius:12px;background:transparent;text-align:left;transition:background .15s,transform .15s}.contact:hover{background:var(--soft);transform:translateX(2px)}.contact.active{background:#e8f2ff}.contact-copy{min-width:0;flex:1}.contact-name-row{display:flex;align-items:center;gap:7px}.contact-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contact-preview{display:block;color:var(--muted);font-size:13px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{color:#fff;background:var(--blue);font-size:10px;font-weight:700;border-radius:10px;padding:3px 7px}.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none;background:#dcecff}.avatar.small{width:42px;height:42px}.chat-pane{min-width:0;display:flex;flex-direction:column;background:#f5f7f9}.chat-header{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 22px}.chat-identity{min-width:0;flex:1}.chat-identity strong{display:block}.chat-identity small{display:block;color:var(--muted);margin-top:3px}.chat-tools{display:flex;gap:6px}.chat-feed{flex:1;overflow:auto;padding:22px max(22px,calc((100% - 800px)/2));display:flex;flex-direction:column;gap:10px;background-color:#eaf0f4;background-image:radial-gradient(#d3dfe8 .6px,transparent .6px);background-size:18px 18px;scroll-behavior:smooth}.day-label{align-self:center;background:#ffffffdf;border-radius:15px;padding:5px 12px;color:var(--muted);font-size:12px;margin:2px 0 8px}.bubble{max-width:min(78%,580px);padding:11px 14px;background:var(--panel);border-radius:16px 16px 16px 5px;box-shadow:0 1px 3px #17212b12;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.5}.bubble.mine{align-self:flex-end;background:var(--out);border-radius:16px 16px 5px 16px}.bubble time{display:block;font-size:10px;color:var(--muted);text-align:right;margin-top:4px}.welcome{align-self:center;max-width:440px;margin:auto;text-align:center;background:#ffffffed;border:1px solid #fff;border-radius:22px;padding:28px;box-shadow:0 8px 30px #17212b10}.welcome img{width:72px;height:72px;border-radius:50%}.welcome h2{margin:12px 0 6px;font-size:22px}.welcome p{color:var(--muted);line-height:1.6;margin:0}.composer{background:var(--panel);padding:13px max(18px,calc((100% - 800px)/2));display:flex;align-items:flex-end;gap:10px;border-top:1px solid var(--line)}.composer textarea{flex:1;min-width:0;max-height:140px;resize:none;border:0;outline:0;border-radius:22px;background:var(--soft);padding:12px 16px;color:var(--text);line-height:1.45}.send{width:44px;height:44px;border:0;border-radius:50%;background:var(--blue);color:white;font-size:19px;transition:transform .15s,opacity .15s}.send:hover{transform:scale(1.05)}.send:disabled{opacity:.55;cursor:wait}.typing{display:flex;gap:4px;align-items:center;height:20px}.typing i{width:6px;height:6px;background:var(--muted);border-radius:50%;animation:pulse .9s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}.notice{padding:7px 12px;background:#fff8df;text-align:center;font-size:11px;color:#78621b;border-top:1px solid #f3e8c1}.mobile-back{display:none}.empty-search{padding:22px;color:var(--muted);text-align:center}.theme-dark{color-scheme:dark;--bg:#171e26;--panel:#202a35;--text:#e9f0f7;--muted:#a0afbd;--line:#35414d;--soft:#2b3743;--out:#31523c;--shadow:0 12px 40px #0003}.theme-dark .chat-pane{background:#1b2630}.theme-dark .chat-feed{background-color:#1b2630;background-image:radial-gradient(#344452 .6px,transparent .6px)}.theme-dark .welcome,.theme-dark .day-label{background:#25313c;border-color:#35414d}.theme-dark .contact.active{background:#263b50}.theme-dark .notice{background:#443b22;color:#f5dc8e;border-color:#55492a}@media(max-width:720px){.app{grid-template-columns:minmax(0,1fr)}.list-pane,.chat-pane{grid-column:1;grid-row:1}.chat-pane{display:none}.app.chat-open .list-pane{display:none}.app.chat-open .chat-pane{display:flex}.mobile-back{display:inline-block}.chat-header{padding:0 10px}.chat-feed{padding:16px 12px}.composer{padding:10px}.bubble{max-width:90%}.list-head{height:62px}}
</style>
</head>
<body>
<main class="app" id="app">
<aside class="list-pane"><div class="list-head"><div class="brand">Cardigram</div><button class="icon-btn" id="theme" aria-label="Changer le thème" title="Changer le thème">◐</button></div><label class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Rechercher un assistant" aria-label="Rechercher un assistant"></label><div class="section-label">Vos assistants</div><div class="contact-list" id="contacts"></div></aside>
<section class="chat-pane" aria-label="Conversation"><header class="chat-header"><button id="back" class="icon-btn mobile-back" aria-label="Retour">‹</button><img id="header-avatar" class="avatar small" alt=""><div class="chat-identity"><strong id="header-name">Choisissez un assistant</strong><small id="header-status">Assistants Cardigram</small></div><div class="chat-tools"><button class="icon-btn" id="clear-chat" title="Effacer la conversation" aria-label="Effacer la conversation">⋯</button></div></header><div class="chat-feed" id="chat-feed" aria-live="polite"></div><form class="composer" id="form"><textarea id="message" rows="1" placeholder="Écrire un message…" aria-label="Écrire un message" maxlength="4000"></textarea><button class="send" id="send" type="submit" aria-label="Envoyer">➤</button></form><div class="notice">Les messages sont enregistrés dans ce navigateur. Si le service IA est indisponible, une réponse de démonstration locale sera utilisée.</div></section>
</main>
<script>
(()=>{'use strict';
const API='https://cardigram-server.onrender.com';const AI_ENDPOINT=API+'/api/ai/chat';const $=id=>document.getElementById(id);const app=$('app');
const assistants=[{id:'cardi',name:'Cardi',role:'Assistant Cardigram',color:'#2684ff',mark:'C',bio:'Ton assistant général pour discuter, poser des questions et organiser tes idées.'},{id:'luna',name:'Luna',role:'Créativité & écriture',color:'#9b59d0',mark:'L',bio:'Une partenaire créative pour inventer des histoires, trouver des idées et écrire.'},{id:'niko',name:'Niko',role:'Tech & apprentissage',color:'#138f83',mark:'N',bio:'Un assistant patient pour expliquer la technologie et apprendre étape par étape.'},{id:'aya',name:'Aya',role:'Bien-être & écoute',color:'#e88955',mark:'A',bio:'Une présence bienveillante pour réfléchir à tes habitudes et prendre du recul.'}];
let active=assistants[0],busy=false;const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}};let store=read('cardigram-ai-conversations',{});
function avatarData(person){const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${person.color}"/><stop offset="1" stop-color="#152c52"/></linearGradient></defs><rect width="100" height="100" rx="50" fill="url(#g)"/><circle cx="50" cy="37" r="18" fill="#fff" opacity=".95"/><path d="M16 91c3-22 16-33 34-33s31 11 34 33" fill="#fff" opacity=".95"/><text x="50" y="44" text-anchor="middle" font-family="Arial" font-weight="700" font-size="18" fill="${person.color}">${person.mark}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function save(){try{localStorage.setItem('cardigram-ai-conversations',JSON.stringify(store))}catch{}}function timeNow(){return new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function list(){const box=$('contacts'),q=$('search').value.trim().toLocaleLowerCase('fr');box.replaceChildren();const found=assistants.filter(a=>(a.name+' '+a.role).toLocaleLowerCase('fr').includes(q));if(!found.length){const empty=document.createElement('div');empty.className='empty-search';empty.textContent='Aucun assistant trouvé';box.append(empty);return}found.forEach(a=>{const b=document.createElement('button');b.type='button';b.className='contact'+(active.id===a.id?' active':'');const img=document.createElement('img');img.className='avatar';img.src=avatarData(a);img.alt='Avatar de '+a.name;const copy=document.createElement('span');copy.className='contact-copy';const row=document.createElement('span');row.className='contact-name-row';const name=document.createElement('span');name.className='contact-name';name.textContent=a.name;const badge=document.createElement('span');badge.className='badge';badge.textContent='IA';row.append(name,badge);const preview=document.createElement('span');preview.className='contact-preview';const history=store[a.id]||[];preview.textContent=history.length?history[history.length-1].text:a.role;copy.append(row,preview);b.append(img,copy);b.onclick=()=>select(a);box.append(b)})}
function select(a){active=a;app.classList.add('chat-open');$('header-avatar').src=avatarData(a);$('header-avatar').alt='Avatar de '+a.name;$('header-name').textContent=a.name;$('header-status').textContent=a.role+' · assistant de démonstration';draw();list();$('message').focus()}
function bubble(message){const el=document.createElement('div');el.className='bubble'+(message.mine?' mine':'');el.append(document.createTextNode(message.text));const time=document.createElement('time');time.textContent=message.time||'';el.append(time);return el}
function draw(){const feed=$('chat-feed');feed.replaceChildren();const history=store[active.id]||[];if(!history.length){const welcome=document.createElement('div');welcome.className='welcome';const img=document.createElement('img');img.src=avatarData(active);img.alt='';const h=document.createElement('h2');h.textContent='Bonjour, je suis '+active.name;const p=document.createElement('p');p.textContent=active.bio+' Écris-moi pour commencer.';welcome.append(img,h,p);feed.append(welcome);return}const day=document.createElement('div');day.className='day-label';day.textContent='Aujourd’hui';feed.append(day);history.forEach(m=>feed.append(bubble(m)));if(busy){const typing=document.createElement('div');typing.className='bubble';typing.setAttribute('aria-label',active.name+' écrit');const dots=document.createElement('span');dots.className='typing';dots.innerHTML='<i></i><i></i><i></i>';typing.append(dots);feed.append(typing)}feed.scrollTop=feed.scrollHeight}
function localReply(person,text){const t=text.toLocaleLowerCase('fr');if(/créateur|créé|qui es-tu|ton nom/.test(t))return `Je suis ${person.name}, un assistant de démonstration créé pour Cardigram. Mes réponses fonctionnent localement tant que le service IA est indisponible.`;if(/bonjour|salut|coucou|bonsoir/.test(t))return `Bonjour ! 😊 Je suis ${person.name}. ${person.bio} Et toi, comment ça va ?`;if(/merci/.test(t))return 'Avec plaisir 😊 Tu veux qu’on continue à en parler ?';if(/triste|stress|anxieux|angoiss|fatigu/.test(t))return 'Je suis désolé que tu te sentes comme ça. Si tu veux, explique-moi ce qui te préoccupe. Je peux écouter, mais je ne remplace pas un professionnel.';if(person.id==='luna')return 'Bonne piste ! On peut la développer ensemble. Quel ton ou quelle ambiance aimerais-tu donner à cette idée ?';if(person.id==='niko')return 'Je peux t’aider à comprendre ça étape par étape. Donne-moi le sujet ou le message d’erreur exact, et je vais le clarifier.';if(person.id==='aya')return 'Merci de m’en parler. Qu’est-ce qui serait le plus utile maintenant : être écouté, faire le point, ou chercher une petite prochaine étape ?';return 'Je comprends. Peux-tu me donner un peu plus de contexte pour que je puisse mieux t’aider ?'}
async function askServer(text,history,person){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assistantId:person.id,assistantName:person.name,message:text,history:history.slice(-12).map(m=>({role:m.mine?'user':'model',text:m.text}))}),signal:controller.signal});if(!response.ok)throw new Error('Service IA indisponible');const data=await response.json(),reply=data.reply||data.text||data.response;if(typeof reply!=='string'||!reply.trim())throw new Error('Réponse IA invalide');return reply.trim()}finally{clearTimeout(timeout)}}
async function sendMessage(text){if(!text||busy)return;const id=active.id,person=active,history=store[id]||(store[id]=[]);history.push({text,mine:true,time:timeNow()});save();$('message').value='';$('message').style.height='auto';busy=true;draw();list();let reply;try{reply=await askServer(text,history,person)}catch{reply=localReply(person,text)}if(active.id===id){history.push({text:reply,mine:false,time:timeNow()});save()}busy=false;draw();list()}
$('form').addEventListener('submit',e=>{e.preventDefault();sendMessage($('message').value.trim())});$('message').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});$('message').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}});$('search').addEventListener('input',list);$('back').onclick=()=>app.classList.remove('chat-open');$('clear-chat').onclick=()=>{if(!store[active.id]?.length)return;if(confirm('Effacer la conversation avec '+active.name+' ?')){delete store[active.id];save();draw();list()}};$('theme').onclick=()=>{document.body.classList.toggle('theme-dark');localStorage.setItem('cardigram-chat-theme',document.body.classList.contains('theme-dark')?'dark':'light')};if(localStorage.getItem('cardigram-chat-theme')==='dark')document.body.classList.add('theme-dark');list();select(active);
})();
</script>
</body>
</html>
