<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0866ff"><title>Cardigram</title>
<style>
:root{--blue:#0866ff;--bg:#f0f2f5;--card:#fff;--text:#050505;--muted:#65676b;--line:#dddfe2}*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body.dark{--bg:#18191a;--card:#242526;--text:#e4e6eb;--muted:#b0b3b8;--line:#3a3b3c}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(420px,100%)}.brand{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:20px;color:var(--blue);font-size:32px;font-weight:bold}.brand svg{width:56px;height:56px}.panel{padding:18px;border-radius:10px;background:var(--card);box-shadow:0 6px 24px #0002}.panel h1{font-size:23px;margin:0 0 7px}.muted{color:var(--muted);font-size:14px}.lang{text-align:right;margin-bottom:12px}.lang select{border:0;background:transparent;color:var(--blue)}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}.field input,.field select{height:48px;width:100%;padding:0 12px;border:1px solid #ccd0d5;border-radius:7px;background:var(--card);color:var(--text)}.phone{display:grid;grid-template-columns:125px 1fr}.phone select{border-radius:7px 0 0 7px;border-right:0}.phone input{border-radius:0 7px 7px 0}.check{display:flex;align-items:center;gap:8px;margin:12px 0}.primary{width:100%;height:46px;border:0;border-radius:7px;background:var(--blue);color:white;font-weight:bold;font-size:17px}.code{display:flex;gap:7px;margin:14px 0}.code input{min-width:0;width:16.66%;height:55px;text-align:center;border:1px solid #ccd0d5;border-radius:7px;background:var(--card);color:var(--text);font-size:23px}.notice{padding:10px;margin-top:12px;border-radius:7px;background:#fff2c2;color:#604800;font-size:12px}
.header{position:fixed;z-index:5;top:0;left:0;right:0;height:56px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:12px}.logo{color:var(--blue);font-size:22px;font-weight:bold}.search{height:38px;border:0;border-radius:20px;padding:0 14px;background:var(--bg);color:var(--text);width:min(260px,28vw)}.tabs{display:flex;justify-content:center;flex:1;height:100%}.tabs button{width:90px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-size:22px}.tabs button.active{border-color:var(--blue);color:var(--blue)}.header-tools{display:flex;gap:7px}.round{width:38px;height:38px;border:0;border-radius:50%;background:var(--bg);color:var(--text)}.layout{max-width:1260px;margin:56px auto 0;display:grid;grid-template-columns:210px minmax(0,650px) 250px;gap:22px;justify-content:center}.side,.right{position:sticky;top:65px;height:calc(100vh - 70px);padding:12px 4px}.side button,.contact{width:100%;height:43px;border:0;border-radius:8px;background:transparent;color:var(--text);text-align:left;padding:7px}.side button:hover,.contact:hover{background:#0001}.feed{min-width:0;padding:14px 0}.box,.post{background:var(--card);border-radius:9px;padding:12px;margin-bottom:14px;box-shadow:0 1px 2px #0002}.stories{display:flex;gap:8px;overflow:auto}.story{position:relative;flex:0 0 145px;height:190px;border:0;border-radius:9px;color:white;text-align:left;background:linear-gradient(140deg,#71b9ff,#7054d2);padding:10px}.story:nth-child(2n){background:linear-gradient(140deg,#ff8b67,#c93a65)}.story strong{position:absolute;left:10px;bottom:10px}.composer{display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;flex:none;border-radius:50%;background:#dfebfa;color:var(--blue);display:grid;place-items:center;font-weight:bold}.composer input{height:40px;flex:1;min-width:0;border:0;border-radius:20px;background:var(--bg);padding:0 14px;color:var(--text)}.row-actions,.post-actions{display:flex;border-top:1px solid var(--line);margin-top:10px;padding-top:7px}.row-actions button,.post-actions button{flex:1;min-height:36px;border:0;border-radius:6px;background:transparent;color:var(--muted)}.post-head{display:flex;align-items:center;gap:8px}.post-head strong{flex:1}.post-text{line-height:1.5;margin:12px 0}.media{height:240px;border-radius:8px;background:linear-gradient(135deg,#dceaff,#f1ddff);display:grid;place-items:center;color:#506178;font-weight:bold;font-size:22px}.post-stats{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted);font-size:13px}.post-actions .liked{color:var(--blue);font-weight:bold}.comment-input{width:100%;margin-top:8px;height:37px;border:0;border-radius:18px;background:var(--bg);padding:0 12px;color:var(--text)}.comments{font-size:14px}.comment{margin-top:6px;padding:7px 11px;background:var(--bg);border-radius:14px;width:max-content;max-width:100%;overflow-wrap:anywhere}.mobile-nav{display:none}.modal-backdrop{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#0006;padding:12px}.modal{position:relative;width:min(500px,100%);background:var(--card);color:var(--text);border-radius:10px;padding:16px;box-shadow:0 8px 30px #0004}.modal h2{margin:0 0 12px;font-size:20px}.modal textarea{width:100%;height:140px;padding:10px;border:1px solid var(--line);border-radius:8px;resize:vertical;background:var(--card);color:var(--text)}.close{position:absolute;top:10px;right:10px;width:32px;height:32px;border:0;border-radius:50%;background:var(--bg);color:var(--text);font-size:20px}.toast{position:fixed;z-index:40;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:white;padding:11px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@media(max-width:950px){.layout{grid-template-columns:minmax(0,650px);padding:0 10px}.side,.right{display:none}.tabs button{width:55px}}@media(max-width:600px){.header{height:50px;padding:0 9px}.search,.tabs{display:none}.header-tools{margin-left:auto}.layout{margin-top:50px;display:block;padding:0 7px}.feed{padding-top:8px}.story{flex-basis:120px;height:165px}.media{height:210px}.mobile-nav{display:flex;position:fixed;z-index:6;left:0;right:0;bottom:0;height:55px;background:var(--card);border-top:1px solid var(--line)}.mobile-nav button{flex:1;border:0;background:transparent;color:var(--muted);font-size:19px}.mobile-nav button.active{color:var(--blue)}body:has(#app:not(.hidden)){padding-bottom:56px}}
</style>
</head>
<body>
<section id="auth" class="auth"><div class="auth-box"><div class="brand"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="30" fill="#0866ff"/><path d="M16 33c8-4 17-8 31-13 2-1 4 1 3 3l-7 26c-1 3-4 3-6 1l-10-9-6 6c-1 1-2 2-3 1l2-10-4-5Z" fill="#fff"/></svg>Cardigram</div><div class="panel" id="phone-panel"><div class="lang"><select id="language"><option value="fr">Français</option><option value="en">English</option><option value="es">Español</option></select></div><h1 data-t="login">Se connecter à Cardigram</h1><p class="muted" data-t="intro">Choisissez votre pays et entrez votre numéro.</p><form id="phone-form"><div class="field"><label data-t="country">Pays</label><select id="country"></select></div><div class="field"><label data-t="phone">Numéro de téléphone</label><div class="phone"><select id="dial" aria-label="Indicatif"></select><input id="phone" required inputmode="tel" placeholder="6 12 34 56 78"></div></div><label class="check"><input type="checkbox" checked><span data-t="keep">Rester connecté</span></label><button class="primary" data-t="continue">Continuer</button><div class="notice" data-t="prototype">Démo : aucun SMS n’est envoyé et le code n’est pas vérifié.</div></form></div><div class="panel hidden" id="code-panel"><h1 data-t="verify">Vérification</h1><p class="muted" id="sent-to"></p><form id="code-form"><div class="code"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"><input maxlength="1" inputmode="numeric"></div><button class="primary" data-t="validate">Valider le code</button><div style="text-align:center;margin-top:10px"><button type="button" id="back" class="text-button" data-t="change">Modifier le numéro</button></div></form></div></div></section>
<section id="app" class="hidden"><header class="header"><div class="logo">Cardigram</div><input id="search" class="search" placeholder="Rechercher"><nav class="tabs"><button class="active" data-view="Accueil">⌂</button><button data-view="Vidéos">▣</button><button data-view="Amis">♧</button><button data-view="Groupes">◎</button></nav><div class="header-tools"><button class="round" id="new-post">＋</button><button class="round" id="notifications">◉</button><button class="round" id="theme">◐</button></div></header><div class="layout"><aside class="side"><button data-feature="Profil">👤　Mon profil</button><button data-feature="Amis">♧　Amis</button><button data-feature="Souvenirs">◷　Souvenirs</button><button data-feature="Enregistrés">▣　Enregistrés</button><button data-feature="Groupes">◎　Groupes</button><button data-feature="Marketplace">🛍　Marketplace</button></aside><main class="feed"><section class="box stories"><button class="story" id="add-story"><strong>＋ Créer une story</strong></button><button class="story"><strong>Amina</strong></button><button class="story"><strong>Jean</strong></button><button class="story"><strong>Mariam</strong></button></section><section class="box"><div class="composer"><div class="avatar">C</div><input id="composer-input" placeholder="Quoi de neuf ?" readonly><button class="round" id="composer-open">＋</button></div><div class="row-actions"><button id="photo-action">▣ Photo / vidéo</button><button id="feeling-action">☺ Humeur</button><button id="location-action">⌖ Lieu</button></div></section><div id="posts"></div></main><aside class="right"><section class="box"><strong>Contacts</strong><p>🟢 Amina</p><p>🟢 Jean</p><p>🟢 Mariam</p><p>🟢 Samuel</p></section></aside></div><nav class="mobile-nav"><button class="active" data-view="Accueil">⌂</button><button data-view="Vidéos">▣</button><button id="mobile-post">＋</button><button data-view="Amis">♧</button><button data-feature="Menu">☰</button></nav></section>
<div id="post-modal" class="modal-backdrop hidden"><div class="modal"><button class="close" data-close="post-modal">×</button><h2>Créer une publication</h2><textarea id="post-text" placeholder="Quoi de neuf ?"></textarea><button class="primary" id="publish">Publier</button></div></div><div id="story-modal" class="modal-backdrop hidden"><div class="modal"><button class="close" data-close="story-modal">×</button><h2>Créer une story</h2><textarea id="story-text" placeholder="Écris une story..."></textarea><button class="primary" id="publish-story">Publier la story</button></div></div><div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
const translations={fr:{login:'Se connecter à Cardigram',intro:'Choisissez votre pays et entrez votre numéro.',country:'Pays',phone:'Numéro de téléphone',keep:'Rester connecté',continue:'Continuer',prototype:'Démo : aucun SMS n’est envoyé et le code n’est pas vérifié.',verify:'Vérification',validate:'Valider le code',change:'Modifier le numéro',like:'J’aime',comment:'Commenter',share:'Partager'},en:{login:'Log in to Cardigram',intro:'Choose your country and enter your phone number.',country:'Country',phone:'Phone number',keep:'Keep me signed in',continue:'Continue',prototype:'Demo: no SMS is sent and the code is not verified.',verify:'Verification',validate:'Verify code',change:'Change number',like:'Like',comment:'Comment',share:'Share'},es:{login:'Iniciar sesión en Cardigram',intro:'Elige tu país e introduce tu número.',country:'País',phone:'Número de teléfono',keep:'Mantener sesión iniciada',continue:'Continuar',prototype:'Demo: no se envía SMS ni se verifica el código.',verify:'Verificación',validate:'Verificar código',change:'Cambiar número',like:'Me gusta',comment:'Comentar',share:'Compartir'}};
const countryData=[['FR','33','France'],['US','1','États-Unis'],['CA','1','Canada'],['GB','44','Royaume-Uni'],['SN','221','Sénégal'],['CI','225','Côte d’Ivoire'],['CM','237','Cameroun'],['TG','228','Togo'],['BJ','229','Bénin'],['BE','32','Belgique'],['CH','41','Suisse'],['DE','49','Allemagne'],['ES','34','Espagne'],['IT','39','Italie'],['PT','351','Portugal'],['MA','212','Maroc'],['DZ','213','Algérie'],['TN','216','Tunisie'],['NG','234','Nigeria'],['GH','233','Ghana'],['IN','91','Inde'],['BR','55','Brésil'],['MX','52','Mexique'],['JP','81','Japon'],['AU','61','Australie'],['ZA','27','Afrique du Sud']];
const $=id=>document.getElementById(id),lang=$('language'),country=$('country'),dial=$('dial');
function refreshCountries(){const locale=lang.value==='en'?'en':lang.value==='es'?'es':'fr';const dn=new Intl.DisplayNames([locale],{type:'region'});country.replaceChildren();countryData.forEach(([iso,code,fallback])=>{const o=document.createElement('option');o.value=iso;o.dataset.dial=code;o.textContent=(dn.of(iso)||fallback)+' (+'+code+')';country.append(o)});country.value='FR';refreshDial()}
function refreshDial(){dial.innerHTML='<option>+'+(country.selectedOptions[0]?.dataset.dial||'33')+'</option>'}refreshCountries();country.addEventListener('change',refreshDial);
lang.addEventListener('change',()=>{document.documentElement.lang=lang.value;document.documentElement.dir=lang.value==='ar'?'rtl':'ltr';const t=translations[lang.value]||translations.en;document.querySelectorAll('[data-t]').forEach(el=>{if(t[el.dataset.t])el.textContent=t[el.dataset.t]});refreshCountries()});
$('phone-form').addEventListener('submit',e=>{e.preventDefault();if(!$('phone').value.trim())return;$('phone-panel').classList.add('hidden');$('code-panel').classList.remove('hidden');$('sent-to').textContent=dial.value+' '+$('phone').value.trim()});$('back').addEventListener('click',()=>{$('code-panel').classList.add('hidden');$('phone-panel').classList.remove('hidden')});
const codeInputs=Array.from(document.querySelectorAll('.code input'));codeInputs.forEach((input,i)=>{input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,1);if(input.value&&codeInputs[i+1])codeInputs[i+1].focus()});input.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!input.value&&codeInputs[i-1])codeInputs[i-1].focus()})});$('code-form').addEventListener('submit',e=>{e.preventDefault();if(codeInputs.some(x=>!x.value)){toast('Saisis les 6 chiffres du code.');return}toast('Démo : le code n’est pas vérifié, connexion réelle indisponible.');});
const app=$('app'),auth=$('auth');function showApp(){auth.classList.add('hidden');app.classList.remove('hidden')}if(localStorage.getItem('cardigram_demo_session')==='yes')showApp();
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2200)}
function openModal(id){$(id).classList.remove('hidden')}function closeModal(id){$(id).classList.add('hidden')}
$('new-post').onclick=()=>openModal('post-modal');$('mobile-post').onclick=()=>openModal('post-modal');$('composer-open').onclick=()=>openModal('post-modal');$('composer-input').onclick=()=>openModal('post-modal');$('add-story').onclick=()=>openModal('story-modal');$('photo-action').onclick=()=>openModal('post-modal');$('feeling-action').onclick=()=>openModal('post-modal');$('location-action').onclick=()=>openModal('post-modal');document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));document.querySelectorAll('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id)}));
function createPost(text,story){const card=document.createElement('article');card.className=story?'story':'post';if(story){card.innerHTML='<strong></strong>';card.querySelector('strong').textContent=text;document.querySelector('.stories').append(card);return}card.innerHTML='<div class="post-head"><div class="avatar">C</div><strong>Cardigram</strong><small>À l’instant · Public</small></div><div class="post-text"></div><div class="media">Cardigram</div><div class="post-stats"><span>👍 <b class="likes-count">0</b></span><span class="comment-count">0 commentaire</span></div><div class="post-actions"><button class="like">♡ J’aime</button><button class="comment-button">○ Commenter</button><button class="share-button">↗ Partager</button></div><div class="comments"></div><input class="comment-input" placeholder="Écrire un commentaire puis appuyer sur Entrée">';card.querySelector('.post-text').textContent=text;const like=card.querySelector('.like');like.onclick=()=>{const active=like.classList.toggle('liked');like.textContent=active?'♥ J’aime':'♡ J’aime';card.querySelector('.likes-count').textContent=active?'1':'0'};card.querySelector('.share-button').onclick=()=>{if(navigator.share)navigator.share({title:'Cardigram',text:text}).catch(()=>{});else toast('Publication prête à être partagée')};card.querySelector('.comment-button').onclick=()=>card.querySelector('.comment-input').focus();card.querySelector('.comment-input').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){const c=document.createElement('div');c.className='comment';c.textContent=e.target.value.trim();card.querySelector('.comments').append(c);e.target.value='';const count=card.querySelector('.comment-count');count.textContent=(card.querySelectorAll('.comment').length)+' commentaire(s)'}};$('posts').prepend(card)}
$('publish').onclick=()=>{const text=$('post-text').value.trim();if(!text){toast('Écris quelque chose avant de publier.');return}createPost(text,false);$('post-text').value='';closeModal('post-modal');toast('Publication ajoutée')};$('publish-story').onclick=()=>{const text=$('story-text').value.trim();if(!text){toast('Écris quelque chose pour ta story.');return}createPost(text,true);$('story-text').value='';closeModal('story-modal');toast('Story ajoutée')};
$('theme').onclick=()=>document.body.classList.toggle('dark');$('notifications').onclick=()=>toast('Aucune nouvelle notification.');document.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>toast(b.dataset.feature+' : interface à venir'));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.view!=='Accueil')toast('Section '+b.dataset.view+' : interface à venir')});$('search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('.post').forEach(p=>p.classList.toggle('hidden',q&&!p.textContent.toLowerCase().includes(q)))});
})();
</script>
</body>
</html>
